<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simtenta — fallspel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Albert+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d1418; --panel:#121c21; --panel2:#17242a; --raise:#1d2d34;
  --ink:#e2edf0; --muted:#85999f; --faint:#5d7177; --line:#243237;
  --teal:#46c7b8; --teal-d:#2c8e83; --amber:#e6ad4d; --red:#e0796a; --green:#7fc89c;
  --display:"Bricolage Grotesque",serif; --body:"Albert Sans",system-ui,sans-serif; --mono:"JetBrains Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
body{
  background:
    radial-gradient(1100px 520px at 82% -8%, rgba(70,199,184,.07), transparent 60%),
    radial-gradient(900px 600px at -5% 110%, rgba(230,173,77,.05), transparent 55%),
    var(--bg);
  min-height:100vh; line-height:1.5;
}
a{color:var(--teal)}
.wrap{max-width:880px;margin:0 auto;padding:28px 20px 90px}
.kicker{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--teal);font-weight:500}
h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,5vw,46px);line-height:1.02;margin:.25em 0 .15em;letter-spacing:-.02em}
h2{font-family:var(--display);font-weight:700;font-size:22px;margin:0 0 4px;letter-spacing:-.01em}
.lede{color:var(--muted);max-width:60ch;margin:6px 0 0}
.hr{height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent);margin:26px 0}

/* ---- home ---- */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:18px 0 10px}
.btn{font-family:var(--body);font-weight:600;font-size:14px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);
  padding:9px 14px;border-radius:10px;cursor:pointer;transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--teal-d);background:var(--raise)}
.btn.primary{background:var(--teal);color:#06201d;border-color:var(--teal)}
.btn.primary:hover{background:#5ad6c6}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.chip{font-family:var(--mono);font-size:11px;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);cursor:pointer;user-select:none}
.chip.on{color:#06201d;background:var(--teal);border-color:var(--teal)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:8px}
.card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;transition:.16s;position:relative;overflow:hidden}
.card:hover{transform:translateY(-2px);border-color:var(--teal-d);box-shadow:0 10px 30px -18px rgba(0,0,0,.8)}
.card .sub{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--teal)}
.card .ttl{font-family:var(--display);font-weight:700;font-size:16.5px;margin:6px 0 6px;line-height:1.12}
.card .fr{color:var(--muted);font-size:12.5px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ytag{position:absolute;top:12px;right:12px;font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.1em;padding:2px 7px;border-radius:6px}
.ytag.HIGH{background:rgba(224,121,106,.16);color:var(--red);border:1px solid rgba(224,121,106,.3)}
.ytag.MED{background:rgba(230,173,77,.14);color:var(--amber);border:1px solid rgba(230,173,77,.28)}

/* ---- player ---- */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.rail{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 18px}
.step{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);
  padding:5px 9px;border-radius:7px;border:1px solid transparent;background:var(--panel);white-space:nowrap}
.step.done{color:var(--teal);border-color:var(--line)}
.step.cur{color:#06201d;background:var(--amber);font-weight:700}
.frame{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--teal);border-radius:0 12px 12px 0;padding:14px 16px;margin-bottom:6px}
.frame .who{font-family:var(--mono);font-size:11px;color:var(--teal);letter-spacing:.08em;text-transform:uppercase}
.frame .ft{margin-top:6px;color:var(--ink)}
.meta{font-family:var(--mono);font-size:11px;color:var(--faint);margin-top:8px;display:flex;gap:14px;flex-wrap:wrap}
.phase{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:16px;padding:20px 20px 18px;margin-top:16px;animation:rise .28s ease}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.phase .lbl{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--amber);font-weight:500}
.phase .goal{font-family:var(--display);font-weight:600;font-size:19px;line-height:1.25;margin:6px 0 14px}
textarea{width:100%;min-height:84px;resize:vertical;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:11px;
  padding:12px 13px;font-family:var(--body);font-size:14.5px;line-height:1.5;outline:none}
textarea:focus{border-color:var(--teal-d)}
.hint{font-size:12px;color:var(--faint);margin-top:7px}
.reveal{margin-top:14px;animation:rise .24s ease}
.reveal .rh{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--teal);margin-bottom:8px}
ul.facit{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
ul.facit li{position:relative;padding:9px 12px 9px 30px;background:var(--bg);border:1px solid var(--line);border-radius:10px;font-size:14px}
ul.facit li:before{content:"›";position:absolute;left:12px;top:8px;color:var(--teal);font-family:var(--mono);font-weight:700}
.pit{margin-top:12px}
.pit .ph{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--red);margin-bottom:7px}
ul.pitfalls{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
ul.pitfalls li{position:relative;padding:8px 12px 8px 30px;background:rgba(224,121,106,.07);border:1px solid rgba(224,121,106,.22);border-radius:10px;font-size:13.5px}
ul.pitfalls li:before{content:"✕";position:absolute;left:12px;top:8px;color:var(--red);font-size:11px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;align-items:center}
.score{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.score .s{flex:1;min-width:120px;text-align:center;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-weight:600;font-size:13.5px;transition:.14s}
.score .s small{display:block;font-family:var(--mono);font-size:10px;color:var(--faint);margin-top:2px;font-weight:400}
.s.pass:hover{border-color:var(--green);color:var(--green)}
.s.partial:hover{border-color:var(--amber);color:var(--amber)}
.s.miss:hover{border-color:var(--red);color:var(--red)}

/* foljdfragor */
.qprog{font-family:var(--mono);font-size:11px;color:var(--faint);margin-bottom:8px}
.qbox{font-family:var(--display);font-weight:600;font-size:18px;line-height:1.3;margin-bottom:12px}
.abox{margin-top:12px;padding:12px 14px;background:var(--bg);border:1px solid var(--line);border-left:3px solid var(--teal);border-radius:0 10px 10px 0;font-size:14.5px;animation:rise .22s ease}

/* feedback + tail */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.pchip{font-family:var(--mono);font-size:10.5px;padding:4px 9px;border-radius:7px;border:1px solid var(--line);display:flex;gap:6px;align-items:center}
.dot{width:7px;height:7px;border-radius:50%}
.dot.pass{background:var(--green)} .dot.partial{background:var(--amber)} .dot.miss{background:var(--red)} .dot.none{background:var(--faint)}
.tail{margin-top:18px;border:1px dashed var(--amber);background:rgba(230,173,77,.05);border-radius:14px;padding:18px}
.tail .th{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--amber);font-weight:600}
.tail .esc{font-family:var(--display);font-weight:600;font-size:18px;margin:10px 0;line-height:1.3}
.foot{margin-top:26px;color:var(--faint);font-size:12px;text-align:center}
.hide{display:none!important}
@media(max-width:560px){.score .s{min-width:0;flex:1 1 30%}}
</style>

<div class="wrap" id="app"></div>

<script>
const DATA = {
  "engine": "simtenta",
  "version": "2.0",
  "language": "sv",
  "format": "ROLL -> ANAMNES -> STATUS -> PROVER -> HANDLAGGNING -> UTREDNING -> PATIENTINFO -> SBAR -> FOLJDFRAGOR -> FEEDBACK -> (TAIL)",
  "grounding": "Grundat i studentsammanstallningarna (Simtenta_T7_HT25, Muntasammanstallning_VT25, Simtenta-prep) + Engine3-matriser.",
  "how_to_play": "Spela en fas i taget. Skriv ditt svar, tryck 'Visa facit', sjalvbedom (Traffade/Delvis/Missade), ga vidare. Foljdfragor en i taget. Avsluta aldrig vid diagnos - kor tail.",
  "cases": [
    {
      "id": "karl_akut_ischemi",
      "subject": "Karlkirurgi",
      "site": "Molndal/Ostra",
      "yield": "HIGH",
      "mode": "docka",
      "role": "Underlakare pa akutmottagningen",
      "frame": "77-arig man, plotslig svaghet/smarta i hoger ben sedan 1,5h. Tidigare EVAR for aneurysm. Ex-rokare 50 paketar.",
      "facit": "Akut extremitetsischemi pa basen av popliteaaneurysm (emboli/trombos).",
      "phases": [
        {
          "type": "anamnes",
          "goal": "Kort riktad anamnes - smartlindra FORST (5mg morfin iv). Debut, emboli vs trombos, kardiell kalla, claudicatio.",
          "reveal": [
            "Debut: plotslig/akut, smarta + motoriskt bortfall i benet.",
            "Tidigare: EVAR for aneurysm, slutat ta medicin senaste aret.",
            "Ej kant formaksflimmer. Ex-rokare 50 pky, aktiv, ingen hemtjanst."
          ],
          "qa": [],
          "pitfalls": [
            "Smartlindra fore/under anamnes - pat ar svart smartpaverkad."
          ]
        },
        {
          "type": "status",
          "goal": "Komplett karlstatus = 6P + ABI, jamfor sidor, palpera ALLA pulsar inkl poplitea.",
          "reveal": [
            "6P: Pain, Pallor, Pulselessness, Paraesthesia, Paralysis, Perishing cold.",
            "Hoger ben blekt, kallt, nedsatt sensorik. Avsaknad puls tibialis+poplitea, femoralis ok.",
            "Palpabel knol i poplitea = popliteaaneurysm. ABI 0,2 hoger / normalt vanster. EKG ua (ej FF)."
          ],
          "qa": [
            {
              "q": "Hur tar och raknar du ABI?",
              "a": "Doppler: systoliskt ankeltryck / hogsta armtryck. <0,9 patologiskt, <0,4 kritisk ischemi."
            },
            {
              "q": "Emboli vs trombos?",
              "a": "Emboli: plotsligt, kardiell kalla/FF, frisk kontralateral sida. Trombos: pa aterosklerotisk botten, tidigare claudicatio."
            }
          ],
          "pitfalls": []
        },
        {
          "type": "prover",
          "goal": "Vilka prover/undersokningar?",
          "reveal": [
            "EKG. Hb, krea, elstatus, koagulation, laktat. Blodgruppering + BAS-test.",
            "EKG sinus (ej FF). Laktat latt stegrat."
          ],
          "qa": [],
          "pitfalls": []
        },
        {
          "type": "handlaggning",
          "goal": "Urakut handlaggning - prioritera.",
          "reveal": [
            "IV smartlindring (morfin).",
            "Heparin iv bolus (forhindra propagering).",
            "Halt benet platt, varmt - ej hogt.",
            "Ring karlkirurgbakjour - SBAR.",
            "CT-angio (folj med pat om instabil/tar tid)."
          ],
          "qa": [],
          "pitfalls": [
            "Skicka pa ULJ-ven / utreda DVT = FAIL (kallt blekt ben = arteriellt, ej DVT).",
            "Vanta till morgonronden = FAIL. Tidsfonster ~6h innan irreversibel skada."
          ]
        },
        {
          "type": "utredning",
          "goal": "Vidare utredning + hur skyndsamt?",
          "reveal": [
            "CT-angio ben. URAKUT - klockan tickar mot irreversibel ischemi (rigor, fixerad missfargning) och reperfusion/kompartment/rhabdo."
          ],
          "qa": [],
          "pitfalls": []
        },
        {
          "type": "patientinfo",
          "goal": "Informera patienten.",
          "reveal": [
            "Allvarlig akut cirkulationsstorning i benet, maste atgardas snabbt for att radda benet, operation/trombolys aktuellt.",
            "Bemotande: lugn, argumentera skyndsamhet utifran funktionsniva (amputation forodande for aktiv man)."
          ],
          "qa": [],
          "pitfalls": []
        },
        {
          "type": "sbar",
          "goal": "Ring karlkirurgbakjour - SBAR (R = skyndsamhet + diagnos + atgard).",
          "reveal": [
            "S: 77-arig man, akut iskemiskt hoger ben sedan 1,5h.",
            "B: EVAR-opererad, ex-rokare 50 pky, slutat med medicin.",
            "A: 6P positiva hoger, avsaknad poplitea/tibialispuls, palpabelt popliteaaneurysm, ABI 0,2.",
            "R: Akut extremitetsischemi pga popliteaaneurysm. Heparin givet. Begar urakut CT-angio + atgard (embolektomi/trombolys, ev bypass)."
          ],
          "qa": [],
          "pitfalls": []
        },
        {
          "type": "foljdfragor",
          "goal": "Foljdfragor fran examinator.",
          "reveal": [],
          "qa": [
            {
              "q": "Behandling vid emboli?",
              "a": "Embolektomi (Fogarty)."
            },
            {
              "q": "Behandling vid popliteaaneurysm?",
              "a": "Bypass."
            },
            {
              "q": "Vad hander om du missar tidsfonstret?",
              "a": "Irreversibel ischemi -> amputation; reperfusion -> kompartmentsyndrom, rhabdomyolys, hyperkalemi."
            },
            {
              "q": "Andra stallen att palpera puls?",
              "a": "Femoralis, poplitea, dorsalis pedis, tibialis posterior."
            }
          ],
          "pitfalls": []
        },
        {
          "type": "feedback",
          "goal": "Sjalvbedomning.",
          "reveal": [
            "PASS om: tankte arteriellt direkt, komplett 6P+ABI bilateralt, heparin + skyndsam karlkontakt.",
            "Vanliga fall: utredde DVT, glomde palpera poplitea (missade aneurysmet), for langsam."
          ],
          "qa": [],
          "pitfalls": []
        }
      ],
      "tail": {
        "directive": "Aldrig slut vid diagnos. Eskalera: postop reperfusion -> spand vad + smarta vid passiv strackning -> kompartmentsyndrom (matt tryck, fasciotomi). Sedan morkfargad urin -> rhabdomyolys -> hyperkalemi pa EKG.",
        "escalations": [
          "Benet ar reperfunderat men vaden ar spand och gor ont vid passiv strackning - vad nu?",
          "Urinen ar morkrod, K 6,2, EKG med toppiga T-vagor - handlagg."
        ]
      }
    },
    {
      "id": "karl_arm_stroke",
      "subject": "Karlkirurgi",
      "site": "Molndal/Ostra",
      "yield": "HIGH",
      "mode": "docka",
      "role": "Underlakare pa akutmottagningen",
      "frame": "81-arig (alt 77) rokare, akut svaghet i arm sedan ca 2h.",
      "facit": "TIA/stroke orsakad av carotisstenos - INTE ett ben-fall. Ring NEUROLOG/strokejour, ej karlkirurg.",
      "phases": [
        {
          "type": "anamnes",
          "goal": "Plotslig fokal neurologi -> tank cerebrovaskulart.",
          "reveal": [
            "Plotslig armsvaghet for ~2h sedan.",
            "FAST: efterfraga tal/syn/ansikte/ben.",
            "Roker 1,5 paket/dag, hypertoni, far statiner men tar dem ej. Ev tidigare bypass/Trombyl."
          ],
          "qa": [],
          "pitfalls": [
            "Forvaxla med perifer ischemi och ringa karlkirurg = fel mottagare."
          ]
        },
        {
          "type": "status",
          "goal": "Neurologstatus + karlstatus - AUSKULTERA CAROTIS.",
          "reveal": [
            "Kraft/sensorik/reflexer. Auskultera carotis (blasljud!). Hjarta (FF?), lungor, buk (aorta). BT, pox, telemetri.",
            "Motoriskt bortfall i armen. Diskreta carotisblasljud. Ej FF. Ben ua."
          ],
          "qa": [
            {
              "q": "Vem ringer du?",
              "a": "Neurolog/strokejour - INTE karlkirurg primart."
            }
          ],
          "pitfalls": []
        },
        {
          "type": "prover",
          "goal": "Prover?",
          "reveal": [
            "Glukos (uteslut hypoglykemi). Hb, krea, elstatus, koag. EKG (FF?).",
            "Glukos normalt, EKG sinus."
          ],
          "qa": [],
          "pitfalls": []
        },
        {
          "type": "handlaggning",
          "goal": "Handlaggning pa akuten.",
          "reveal": [
            "Dra strokelarm.",
            "Nativ CT-hjarna + CT-angio halskarl/hjarna.",
            "Ring strokejour/neurolog.",
            "Bedom trombolysfonster."
          ],
          "qa": [],
          "pitfalls": [
            "Ringa karlkirurgen forst = poangforlust. Karotiskirurgi kommer senare."
          ]
        },
        {
          "type": "utredning",
          "goal": "Utredning + skyndsamhet.",
          "reveal": [
            "CT-hjarna nativ + CT-angio hals/hjarna med kontrast. Akut strokefonster (trombolys/trombektomi)."
          ],
          "qa": [],
          "pitfalls": []
        },
        {
          "type": "patientinfo",
          "goal": "Informera patienten.",
          "reveal": [
            "Misstanke stroke/TIA, snabb rontgen pagar, inlaggning + utredning av halskarl.",
            "Bemotande: lugn trygghet utan att skramma."
          ],
          "qa": [],
          "pitfalls": []
        },
        {
          "type": "sbar",
          "goal": "SBAR till neurolog/strokejour.",
          "reveal": [
            "S: 81-arig rokare, akut armsvaghet 2h.",
            "B: Obehandlad hypertoni/hyperlipidemi, tar ej statiner.",
            "A: Fokal pares, carotisblasljud, ej FF, glukos normalt.",
            "R: Misstanke stroke/TIA pga carotisstenos. Drar strokelarm, begar CT-hjarna + CT-angio halskarl; neurolog for trombolys; karlkirurgi for stenosen senare."
          ],
          "qa": [],
          "pitfalls": []
        },
        {
          "type": "foljdfragor",
          "goal": "Foljdfragor.",
          "reveal": [],
          "qa": [
            {
              "q": "Varfor inte karlkirurgen forst?",
              "a": "Akut cerebral ischemi handlaggs av stroke/neuro. Karotis-endarterektomi/stentning sker sekundart for att forhindra recidiv."
            },
            {
              "q": "Fynd pa CT-angio?",
              "a": "Ischemi + signifikant carotisstenos."
            }
          ],
          "pitfalls": []
        },
        {
          "type": "feedback",
          "goal": "Sjalvbedomning.",
          "reveal": [
            "PASS om: auskulterade carotis, drog strokelarm, ringde neurolog.",
            "Vanliga fall: ringde karlkirurg, missade carotisblasljud."
          ],
          "qa": [],
          "pitfalls": []
        }
      ],
      "tail": {
        "directive": "Fortsatt: trombolys ges -> plotslig huvudvark + sjunkande medvetande -> misstanke blodning, akut CT. Eller senare recidiv-TIA -> tidpunkt for karotiskirurgi.",
        "escalations": [
          "Patienten fick trombolys och blir nu plotsligt mer somnolent med huvudvark - vad gor du?"
        ]
      }
    },
    {
      "id": "anestesi_postop_abcde",
      "subject": "Anestesi",
      "site": "Molndal/Ostra",
      "yield": "HIGH",
      "mode": "docka+ssk",
      "role": "Underlakare anestesi/IVA, kallas till UVA",
      "frame": "60-70-arig man, ~40 min postop efter kolonkirurgi (mycket blod givet, CVK/EDA). Borjar fa svart att andas. Ssk ringer.",
      "facit": "B-problem postop. Diffar: atelektas (vanligast), pneumothorax (CVK!), hemothorax, lungemboli, vatskeoverlast. Strukturerad ABCDE avgor.",
      "phases": [
        {
          "type": "status",
          "goal": "ABCDE i ordning, atgarda innan du gar vidare, REEVALUERA.",
          "reveal": [
            "A: fri luftvag?",
            "B: AF, pox, auskultera + PERKUTERA, kanna over CVK (knaster=luft?).",
            "C: BT, puls, pulsar, 2 grova infarter, blodgas.",
            "D: pupiller, RLS, glukos. E: temp, hudkostym, logroll.",
            "Fynd: pox 90 fallande, AF ~30, dampat basalt/apikalt. Perkussion dampat (vatska/atelektas) ELLER tympanistiskt (luft = pneumothorax via CVK). Blodgas lagt pO2/hogt laktat. D/E ua."
          ],
          "qa": [
            {
              "q": "Skilj atelektas/pneumothorax/hemothorax kliniskt?",
              "a": "Atelektas: dampat, sjunkande pox, vanligast. Pneumothorax: tympanistiskt, ev knaster vid CVK. Hemothorax: dampat + cirkulationspaverkan."
            },
            {
              "q": "Bekrafta pneumothorax utan att flytta instabil pat?",
              "a": "Klinik + ev naldekompression; lungrtg endast om stabil."
            }
          ],
          "pitfalls": []

let S = {}; // session state

const el = (h)=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstChild;};
const app = document.getElementById('app');
function esc(s){return (s||"").replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

/* ---------------- HOME ---------------- */
let filterSub = "ALL";
function home(){
  S = {};
  const subs = [...new Set(DATA.cases.map(c=>c.subject))];
  const cases = DATA.cases.filter(c=>filterSub==="ALL"||c.subject===filterSub);
  app.innerHTML = "";
  app.append(el(`<div>
    <div class="kicker">T7 · klinisk simuleringstenta</div>
    <h1>Simtenta — fallspel</h1>
    <p class="lede">Tryck igenom riktiga rapporterade fall, fas för fas, precis som på tentan:
    anamnes → status → prover → handläggning → utredning → patientinfo → SBAR → följdfrågor.
    Skriv eller tänk högt, vänd på facit, bedöm dig själv. Fallet slutar aldrig vid diagnosen.</p>
  </div>`));
  const tb = el(`<div class="toolbar"></div>`);
  tb.append(el(`<button class="btn primary" id="rand">⚡ Slumpa HIGH-yield</button>`));
  tb.append(el(`<span class="chip ${filterSub==='ALL'?'on':''}" data-s="ALL">Alla (${DATA.cases.length})</span>`));
  subs.forEach(s=>tb.append(el(`<span class="chip ${filterSub===s?'on':''}" data-s="${esc(s)}">${esc(s)}</span>`)));
  app.append(tb);
  tb.querySelector('#rand').onclick=()=>{const h=DATA.cases.filter(c=>c.yield==='HIGH');start(h[Math.floor(Math.random()*h.length)]);};
  tb.querySelectorAll('.chip').forEach(ch=>ch.onclick=()=>{filterSub=ch.dataset.s;home();});

  const grid = el(`<div class="grid"></div>`);
  cases.forEach(c=>{
    const card = el(`<div class="card">
      <span class="ytag ${c.yield}">${c.yield}</span>
      <div class="sub">${esc(c.subject)}</div>
      <div class="ttl">${esc(c.frame.split('.')[0])}.</div>
      <div class="fr">${esc(c.role)} · ${esc(c.facit)}</div>
    </div>`);
    card.onclick=()=>start(c);
    grid.append(card);
  });
  app.append(grid);
  app.append(el(`<div class="foot">Grundat i era egna sammanställningar + Engine3-matriser. Framsteg sparas inte mellan omladdningar.</div>`));
  window.scrollTo(0,0);
}

/* ---------------- START CASE ---------------- */
function start(c){
  S = {c, pi:0, qi:0, revealed:false, scores:{}, tail:-1};
  renderPhase();
}

function railHTML(){
  const ph = S.c.phases;
  return `<div class="rail">`+ph.map((p,i)=>{
    const cls = i<S.pi?'done':(i===S.pi?'cur':'');
    return `<span class="step ${cls}">${PLAB[p.type]||p.type}</span>`;
  }).join('')+`</div>`;
}
function frameHTML(){
  const c=S.c;
  return `<div class="frame"><div class="who">${esc(c.role)} · ${esc(c.subject)} · ${esc(c.site)}</div>
    <div class="ft">${esc(c.frame)}</div>
    <div class="meta"><span>👤 ${esc(c.mode)}</span><span>yield: ${c.yield}</span></div></div>`;
}

  return `<div class="top">
    <button class="btn ghost sm" id="back">← Fall</button>
    <div style="font-family:var(--mono);font-size:11px;color:var(--faint)">Fas ${Math.min(S.pi+1,S.c.phases.length)}/${S.c.phases.length}</div>
  </div>`;
}

/* ---------------- RENDER A PHASE ---------------- */
function renderPhase(){
  const c=S.c; 
  if(S.pi>=c.phases.length){return renderEnd();}
  const p=c.phases[S.pi];
  if(p.type==='feedback'){return renderEnd();}
  if(p.type==='foljdfragor'){return renderFoljd();}

  app.innerHTML="";
  app.append(el(topHTML()));
  app.append(el(railHTML()));
  app.append(el(frameHTML()));
  
  const isInteractive = (p.type === 'anamnes' || p.type === 'status');
  const displayGoal = isInteractive ? (PVERB[p.type] || "") : (p.goal || PVERB[p.type] || "");
  
  const ph=el(`<div class="phase">
    <div class="lbl">${PLAB[p.type]||p.type}</div>
    <div class="goal">${esc(displayGoal)}</div>
    ${isInteractive ? `<div id="chatlog" style="margin-bottom:12px;font-size:14.5px;"></div>` : ''}
    <textarea id="ans" placeholder="${esc(PVERB[p.type]||'Skriv eller tänk högt…')}"></textarea>
    <div class="hint">Skriv ditt svar, eller bara tänk det. Tryck <b>Visa facit</b> (eller Cmd/Ctrl+Enter) när du är klar.</div>
    <div class="actions">
      ${isInteractive ? `<button class="btn ghost" id="ask">${p.type==='anamnes' ? 'Fråga patienten' : 'Utför undersökning'}</button>` : ''}
      <button class="btn primary" id="show">Visa facit</button>
    </div>
    <div id="rev"></div>
  </div>`);
  app.append(ph);
  wireBack();
  const ta=ph.querySelector('#ans');
  ta.focus();
  
  if (isInteractive) {
    ph.querySelector('#ask').onclick = () => {
      const text = ta.value.trim().toLowerCase();
      if (!text) return;
      const words = text.split(/\\W+/).filter(w => w.length > 2);
      let matched = [];
      p.reveal.forEach(r => {
        const rLower = r.toLowerCase();
        if (words.some(w => rLower.includes(w))) {
          matched.push(r);
        }
      });
      const chatlog = ph.querySelector('#chatlog');
      chatlog.innerHTML += `<div style="margin-bottom:8px;color:var(--faint)"><b>Du:</b> ${esc(ta.value)}</div>`;
      if (matched.length > 0) {
        matched.forEach(m => chatlog.innerHTML += `<div style="margin-bottom:10px;color:var(--teal)"><b>Svar:</b> ${esc(m)}</div>`);
      } else {
        chatlog.innerHTML += `<div style="margin-bottom:10px;color:var(--amber)"><b>Svar:</b> (Inget uppenbart fynd/svar. Formulera om eller gå vidare.)</div>`;
      }
      ta.value = '';
    };
  }

  const show=()=>revealPhase(p);
  ph.querySelector('#show').onclick=show;
  ta.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)){e.preventDefault();show();}});
  window.scrollTo(0,0);
}
function revealPhase(p){
  if(S.revealed)return; S.revealed=true;
  const rev=document.getElementById('rev');
  document.getElementById('show').classList.add('hide');
  let h=`<div class="reveal">`;
  
  const isInteractive = (p.type === 'anamnes' || p.type === 'status');
  if (isInteractive && p.goal) {
    h += `<div class="goal-reveal" style="margin-bottom:12px;color:var(--faint);"><strong>Mål:</strong> ${esc(p.goal)}</div>`;
  }
  
  h += `<div class="rh">Facit / fynd</div><ul class="facit">`+
    (p.reveal.length?p.reveal:["(inga punkter)"]).map(r=>`<li>${esc(r)}</li>`).join('')+`</ul>`;
  if(p.pitfalls&&p.pitfalls.length){
    h+=`<div class="pit"><div class="ph">Fallgropar — undvik dessa</div><ul class="pitfalls">`+
      p.pitfalls.map(x=>`<li>${esc(x)}</li>`).join('')+`</ul></div>`;
  }
  h+=`<div class="score">
      <div class="s pass" data-v="pass">Träffade<small>1</small></div>
      <div class="s partial" data-v="partial">Delvis<small>2</small></div>
      <div class="s miss" data-v="miss">Missade<small>3</small></div>
    </div></div>`;
  rev.append(el(h));
  rev.querySelectorAll('.s').forEach(b=>b.onclick=()=>scorePhase(p.type,b.dataset.v));
}
function scorePhase(type,v){ S.scores[S.pi]={type,v}; S.pi++; S.revealed=false; renderPhase(); }
document.addEventListener('keydown',e=>{
  if(S.revealed && ['1','2','3'].includes(e.key)){
    const m={'1':'pass','2':'partial','3':'miss'}[e.key];
    const b=document.querySelector('.s.'+m); if(b)b.click();
  }
});

/* ---------------- FÖLJDFRÅGOR ---------------- */
function renderFoljd(){
  const c=S.c,p=c.phases[S.pi];
  const qa=p.qa;
  if(S.qi>=qa.length){ S.scores[S.pi]={type:'foljdfragor',v:S.fjmiss?'partial':'pass'}; S.pi++; S.qi=0; S.revealed=false; return renderPhase(); }
  app.innerHTML="";
  app.append(el(topHTML()));
  app.append(el(railHTML()));
  app.append(el(frameHTML()));
  const q=qa[S.qi];
  const ph=el(`<div class="phase">
    <div class="lbl">${PLAB.foljdfragor}</div>
    <div class="qprog">Fråga ${S.qi+1} / ${qa.length}</div>
    <div class="qbox">${esc(q.q)}</div>
    <textarea id="ans" placeholder="Ditt svar…"></textarea>
    <div class="actions"><button class="btn primary" id="show">Visa svar</button></div>
    <div id="rev"></div>
  </div>`);
  app.append(ph); wireBack();
  const ta=ph.querySelector('#ans'); ta.focus();
  const show=()=>{
    if(S.revealed)return; S.revealed=true;
    document.getElementById('show').classList.add('hide');
    const rev=document.getElementById('rev');
    rev.append(el(`<div class="abox">${esc(q.a)}</div>`));
    rev.append(el(`<div class="actions">
        <button class="btn sm" id="m">Missade den</button>
        <button class="btn primary sm" id="n">${S.qi+1<qa.length?'Nästa fråga →':'Klar →'}</button></div>`));
    rev.querySelector('#m').onclick=()=>{S.fjmiss=true;next();};
    rev.querySelector('#n').onclick=next;
  };
  const next=()=>{S.qi++;S.revealed=false;renderFoljd();};
  ph.querySelector('#show').onclick=show;
  ta.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)){e.preventDefault();show();}});
  window.scrollTo(0,0);
}

/* ---------------- FEEDBACK + TAIL ---------------- */
function renderEnd(){
  const c=S.c;
  const fb=c.phases.find(p=>p.type==='feedback');
  app.innerHTML="";
  app.append(el(topHTML()));
  app.append(el(railHTML()));
  const box=el(`<div class="phase"><div class="lbl">Feedback</div>
    <div class="goal">Återkoppling</div></div>`);
  // per-phase score chips
  const chips=el(`<div class="chips"></div>`);
  c.phases.forEach((p,i)=>{
    if(p.type==='feedback')return;
    const sc=S.scores[i]; const v=sc?sc.v:'none';
    chips.append(el(`<span class="pchip"><span class="dot ${v}"></span>${PLAB[p.type]||p.type}</span>`));
  });
  box.append(chips);
  if(fb){
    box.append(el(`<div class="reveal"><div class="rh">Bedömning</div><ul class="facit">`+
      fb.reveal.map(r=>`<li>${esc(r)}</li>`).join('')+`</ul></div>`));
  }
  app.append(box);

  // tail
  const t=c.tail||{};
  const escs=t.escalations||[];
  const tail=el(`<div class="tail">
    <div class="th">⟳ Fallet är inte slut — tail</div>
    <div id="tailbody"></div>
  </div>`);
  app.append(tail);
  renderTail(tail.querySelector('#tailbody'),t,escs);

  const nav=el(`<div class="actions" style="margin-top:22px; display:none;" id="endnav">
    <button class="btn primary" id="rand">⚡ Nästa HIGH-yield</button>
    <button class="btn" id="home">Alla fall</button>
  </div>`);
  app.append(nav);
  nav.querySelector('#home').onclick=home;
  nav.querySelector('#rand').onclick=()=>{const h=DATA.cases.filter(x=>x.yield==='HIGH');start(h[Math.floor(Math.random()*h.length)]);};
  wireBack();
  window.scrollTo(0,0);
}
function renderTail(node,t,escs){
  S.tail++;
  if(S.tail>=escs.length){
    node.innerHTML="";
    node.append(el(`<div class="esc" style="color:var(--muted);font-size:15px;font-weight:500">
      Fallet är slut. Nästa fall?</div>`));
    const nav = document.getElementById('endnav');
    if (nav) nav.style.display = 'flex';
    return;
  }
  node.innerHTML="";
  node.append(el(`<div class="esc">${esc(escs[S.tail])}</div>`));
  node.append(el(`<textarea id="tans" placeholder="Hur handlägger du? Tänk högt…"></textarea>`));
  const a=el(`<div class="actions"><button class="btn sm" id="tn">${S.tail+1<escs.length?'Nästa eskalering →':'Avsluta fall →'}</button></div>`);
  node.append(a);
  a.querySelector('#tn').onclick=()=>renderTail(node,t,escs);
}

function wireBack(){const b=document.getElementById('back');if(b)b.onclick=home;}

home();
</script>
